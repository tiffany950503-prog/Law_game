<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>國民法官：庭審日誌</title>
<meta name="description" content="國民法官模擬遊戲：心理側寫前測、六個多日庭審案件、交互詰問、筆記教學與評議。">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&display=swap">
<style>
[hidden]{display:none!important}
:root{--navy:#0F1E3D;--navy2:#18294D;--teal:#0E7C74;--teal2:#5FD3C4;--amber:#E8B04A;--bg:#F4F6F5;--alt:#E6EDEB;--ink:#13233F;--sub:#3E4C63;--mute:#6B7689;--line:#C5D1CE;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Noto Sans TC',system-ui,sans-serif;background:#DCE4E2;color:var(--ink);display:flex;justify-content:center;align-items:center;-webkit-tap-highlight-color:transparent}
#phone{width:100%;max-width:430px;height:100%;max-height:900px;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
@media (min-width:600px){#phone{height:calc(100% - 32px);border:10px solid #1A2233;border-radius:44px;box-shadow:0 20px 60px rgba(15,30,61,.25)}}
.num{font-family:'Space Grotesk',system-ui,sans-serif}
/* top */
#top{background:var(--navy);color:#F4F6F5;padding:10px 14px 8px;display:flex;align-items:center;gap:10px}
#timer{font-family:'Space Grotesk';font-weight:700;font-size:20px;color:var(--teal2);min-width:58px}
#timer.low{color:var(--amber)}
#stage{flex:1;font-weight:700;font-size:15px;color:#BFD8D5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#help{width:34px;height:34px;border-radius:50%;border:2px solid var(--teal2);background:transparent;color:var(--teal2);font-weight:900;font-size:18px;cursor:pointer}
#issue{background:var(--navy2);color:#F4F6F5;text-align:center;font-weight:700;font-size:15px;padding:6px 10px;display:none}
#issue b{color:var(--amber)}
#issue.on{display:block}
#issue .tally{font-weight:500;color:#BFD8D5;margin-left:8px;font-size:13px}
/* scene */
#scene{width:100%;aspect-ratio:324/172;background:#EFE6D2;flex-shrink:0;position:relative;overflow:hidden}
#scene svg{width:100%;height:100%;display:block}
#scene .fade{animation:fade .35s ease}
@keyframes fade{from{opacity:.2}to{opacity:1}}
#progress{height:4px;background:var(--alt)}
#progress div{height:100%;background:var(--teal);width:0;transition:width .4s}
/* dialog */
#dialog{margin:10px 12px 0;background:#FFFFFF;border:2px solid var(--navy);border-radius:10px;padding:10px 14px 12px;min-height:96px;position:relative;cursor:pointer;flex-shrink:0}
#who{display:inline-block;font-size:13px;font-weight:700;color:#fff;background:var(--navy);padding:2px 10px;border-radius:5px;margin-bottom:6px}
#who.judge{background:#2F5D8F}#who.pros{background:#7B4FA6}#who.def{background:#4A5568}#who.npc{background:#C77B2E}#who.you{background:var(--teal)}#who.sys{background:var(--mute)}#who.wit{background:#9A5B6A}
#text{font-size:16.5px;line-height:1.6;min-height:52px}
#next{position:absolute;right:12px;bottom:6px;color:var(--teal);font-size:14px;animation:bob 1s infinite;display:none}
#next.on{display:block}
@keyframes bob{50%{transform:translateY(3px)}}
/* actions */
#actions{flex:1;overflow-y:auto;padding:10px 12px 16px;display:flex;flex-direction:column;gap:8px}
.btn{font:inherit;font-size:16px;font-weight:700;border:none;border-radius:10px;padding:13px 14px;background:var(--teal);color:#F4F6F5;cursor:pointer;text-align:center}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--alt);color:var(--ink)}
.btn.amber{background:var(--amber);color:var(--navy)}
.opt{font:inherit;font-size:15.5px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;color:var(--ink);line-height:1.45}
.opt b{color:var(--teal);margin-right:8px}
.opt:hover{border-color:var(--teal)}
.opt.used{opacity:.45}
.label{font-size:13px;font-weight:700;color:var(--mute);letter-spacing:1px}
.card{background:#fff;border-left:5px solid var(--teal);border-radius:6px;padding:10px 12px;font-size:15.5px;line-height:1.55}
.card.warm{border-left-color:var(--amber)}
.card.navy{background:var(--navy);color:#F4F6F5;border-left-color:var(--teal2)}
.card h4{font-size:16px;margin-bottom:4px}
.chips{display:flex;gap:8px}
.chip{flex:1;font:inherit;font-weight:700;font-size:15px;padding:10px 0;border-radius:10px;border:2px solid var(--teal);background:#fff;color:#0E5F59;cursor:pointer}
.chip.k{border-color:#B5473A;color:#9A3328}
.chip.h{border-color:#2F6FB0;color:#22578C}
.chip.u{border-color:var(--mute);color:var(--sub)}
.tabs{display:flex;gap:6px}
.tab{flex:1;font:inherit;font-size:14.5px;font-weight:700;padding:8px 0;border-radius:8px;border:none;background:var(--alt);color:var(--sub);cursor:pointer}
.tab.on{background:var(--teal);color:#fff}
.inrow{display:flex;gap:6px}
.inrow input,.inrow textarea{flex:1;font:inherit;font-size:16px;border:2px dashed #9AA6B5;border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink);resize:none}
.inrow .btn{padding:10px 14px;white-space:nowrap}
.quota{font-size:13.5px;color:var(--mute);text-align:right}
.hint{background:#FFF6E2;border:1px solid var(--amber);border-radius:10px;padding:8px 12px;font-size:14.5px;line-height:1.5;color:#5A4210}
.hold{position:relative;overflow:hidden}
.hold .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.28)}
.votes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.v{background:#fff;border-radius:8px;padding:6px 4px;text-align:center;font-size:13px;line-height:1.35;border:2px solid var(--line)}
.v b{display:block;font-size:14px}
.v.k{border-color:#B5473A;background:#FBEDEA}.v.h{border-color:#2F6FB0;background:#EAF2FB}
.v.me{box-shadow:0 0 0 3px var(--amber)}
.meter{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--alt)}
.meter .a{background:#B5473A}.meter .b{background:#2F6FB0}
.row{display:flex;justify-content:space-between;font-size:14px;color:var(--sub)}
input[type=range]{width:100%;accent-color:var(--teal);height:32px}
.big{font-size:26px;font-weight:900;text-align:center;color:var(--teal);font-family:'Space Grotesk','Noto Sans TC'}
.title{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:4px 18px 20px}
.title h1{font-size:34px;font-weight:900;line-height:1.2}
.title p{font-size:16px;color:var(--sub);line-height:1.6}
.small{font-size:12.5px;color:var(--mute);line-height:1.5}
.tl{display:flex;flex-wrap:wrap;gap:6px}
.tg{font-size:13.5px;padding:4px 10px;border-radius:999px;background:#fff;border:1.5px solid var(--line)}
.tg.k{border-color:#B5473A;color:#9A3328}.tg.h{border-color:#2F6FB0;color:#22578C}
/* modal */
#modal{position:absolute;inset:0;background:rgba(15,30,61,.55);display:none;align-items:flex-end;z-index:9}
#modal.on{display:flex}
#sheet{background:var(--bg);width:100%;max-height:82%;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 16px 22px;display:flex;flex-direction:column;gap:10px}
#sheet h3{font-size:19px}
#toast{position:absolute;left:12px;right:12px;bottom:14px;z-index:8;display:none}
#toast.on{display:block;animation:fade .3s}
.typing{display:inline-block;width:1.5em;text-align:left}
#snd{width:34px;height:34px;border-radius:50%;border:2px solid #BFD8D5;background:transparent;color:#BFD8D5;font-weight:900;font-size:16px;cursor:pointer;font-family:inherit}
#snd.off{opacity:.45}
#locker{width:34px;height:34px;border-radius:50%;border:2px solid #BFD8D5;background:transparent;color:#BFD8D5;font-weight:900;font-size:14px;cursor:pointer;font-family:inherit}
#locker.bump{animation:bump .6s}
@keyframes bump{30%{transform:scale(1.25);border-color:var(--amber);color:var(--amber)}}
.q h2{font-size:21px;line-height:1.45;margin:4px 0 6px}
.dots{display:flex;gap:6px}.dots span{flex:1;height:5px;border-radius:3px;background:var(--line)}.dots span.on{background:var(--teal)}
.type{background:var(--navy);color:#F4F6F5;border-radius:12px;padding:14px 16px}
.type h3{font-size:22px;color:var(--amber);margin:2px 0 6px}
.type p{font-size:14.5px;line-height:1.6;color:#DCE8E6}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:13.5px;color:var(--sub)}
.bars .bar{height:8px;border-radius:4px;background:var(--alt);overflow:hidden}.bars .bar i{display:block;height:100%;background:var(--teal)}
.t57{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff;border-radius:8px;overflow:hidden}
.t57 td{padding:6px 8px;border-bottom:1px solid var(--alt);vertical-align:top}
.t57 td:last-child{text-align:right;white-space:nowrap;font-weight:700}
.up{color:#9A3328}.down{color:#22578C}.none{color:var(--mute)}
.tree{display:flex;flex-direction:column;gap:6px}
.node{font:inherit;text-align:left;font-size:15px;background:#fff;border:2px dashed #9AA6B5;border-radius:10px;padding:10px 12px;cursor:pointer;color:var(--ink);line-height:1.45}
.node.ok{border:2px solid var(--teal);background:#E7F5F2;cursor:default}
.node small{display:block;color:var(--teal);font-weight:700;font-size:13px}
.lockedmsg{background:#EEF1F6;border:1px dashed #6B7689;border-radius:10px;padding:8px 12px;font-size:14px;color:var(--sub)}
.anchor{font-family:'Space Grotesk','Noto Sans TC';font-size:44px;font-weight:700;color:var(--amber);line-height:1}
.chip.s{border-color:var(--teal);color:#0E5F59}
.tab{font-size:13.5px}

/* ---- 庭審日誌 additions ---- */
#day{font-family:'Space Grotesk','Noto Sans TC',system-ui,sans-serif;font-weight:700;font-size:13.5px;color:var(--teal2);white-space:nowrap;max-width:132px;overflow:hidden;text-overflow:ellipsis}
#who.exp{background:#2E7D5B}
.screen{position:absolute;left:31%;top:6%;width:64%;height:52%;background:#16264A;border:3px solid #0B1530;border-radius:6px;color:#F4F6F5;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:6px 10px;font-weight:700;font-size:15px;line-height:1.35}
.screen small{display:block;font-weight:500;font-size:11.5px;color:#9FC7C1;margin-top:3px}
.lesson{background:#EAF6F4;border:2px solid var(--teal);border-radius:10px;padding:10px 12px;line-height:1.55;font-size:15px}
.lesson h4{font-size:16.5px;margin:2px 0 4px;line-height:1.4}
.lesson .label{color:var(--teal)}
.recess{background:#2B2F4A;color:#EEF0F7;border-radius:12px;padding:12px 14px;line-height:1.55;font-size:15px}
.recess .label{color:#E8B04A}
.recess h4{font-size:17px;margin:2px 0 4px}
.fb{border-radius:10px;padding:9px 12px;font-size:14.5px;line-height:1.6}
.fb.ok{background:#E7F5F2;border:1px solid var(--teal)}
.fb.no{background:#FBEDEA;border:1px solid #B5473A}
.fb.mid{background:#FFF6E2;border:1px solid var(--amber)}
.opt.right{border-color:var(--teal);background:#E7F5F2}
.opt.wrong{border-color:#B5473A;background:#FBEDEA}
.opt[disabled]{cursor:default}
.cls{background:#fff;border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;border:1.5px solid var(--line);font-size:15px;line-height:1.45}
.cls .chip{font-size:14px;padding:7px 0}
.chip.sel{background:var(--teal);color:#fff;border-color:var(--teal)}
.chip.k.sel{background:#B5473A;color:#fff}.chip.h.sel{background:#2F6FB0;color:#fff}.chip.u.sel{background:var(--mute);color:#fff}
.chip[disabled]{cursor:default}
.note{background:#FFFDF6;border:1px solid #E5D9B8;border-radius:8px;padding:8px 10px;font-size:14.5px;line-height:24px;background-image:repeating-linear-gradient(transparent 0 23px,#EFE6CF 23px 24px)}
.note .meta{font-size:12px;color:var(--mute);font-weight:700;line-height:1.4;display:flex;gap:6px;flex-wrap:wrap}
.note .meta i{font-style:normal;padding:0 6px;border-radius:4px;background:var(--alt)}
.note .meta i.a{background:#FBEDEA;color:#9A3328}.note .meta i.b{background:#EAF2FB;color:#22578C}
.pick{cursor:pointer}.pick.on{outline:3px solid var(--amber)}
textarea#nt{width:100%;min-height:76px;font:inherit;font-size:15.5px;border:2px dashed #9AA6B5;border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink);resize:vertical;line-height:1.5}
.cal{display:flex;flex-direction:column;gap:6px}
.cal .d{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:8px;padding:8px 10px;border:1.5px solid var(--line);font-size:14px;line-height:1.5}
.cal .d b{font-family:'Space Grotesk','Noto Sans TC';min-width:84px;color:var(--teal)}
.cal .d.now{border-color:var(--amber);box-shadow:0 0 0 2px #F6DFAE}
.cal .d.done{opacity:.6}
.cal .d .new{color:#9A3328;font-weight:700}
.bigdate{font-family:'Space Grotesk','Noto Sans TC';font-size:40px;font-weight:700;color:var(--navy);text-align:center;line-height:1.1}
.bigdate small{display:block;font-size:15px;color:var(--mute);font-weight:500;margin-top:6px}
.lean{background:#fff;border-radius:10px;padding:10px 12px;border:1.5px solid var(--line)}
.lean .ends{display:flex;justify-content:space-between;font-size:13.5px;font-weight:700}
.lean .ends span:first-child{color:#9A3328}.lean .ends span:last-child{color:#22578C}
.seq{display:flex;flex-direction:column;gap:6px}
.seq button{font:inherit;text-align:left;font-size:14.5px;background:#fff;border:2px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;color:var(--ink);line-height:1.4;display:flex;gap:8px;align-items:flex-start}
.seq button i{font-style:normal;min-width:22px;height:22px;border-radius:50%;background:var(--alt);text-align:center;font-weight:700;font-size:13px;line-height:22px;font-family:'Space Grotesk'}
.seq button.on{border-color:var(--teal);background:#E7F5F2}.seq button.on i{background:var(--teal);color:#fff}
.dice{display:flex;gap:14px;justify-content:center;padding:6px 0}
.die{width:64px;height:64px;border-radius:12px;background:#fff;border:3px solid var(--navy);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:7px}
.die span{width:11px;height:11px;border-radius:50%;background:var(--navy);margin:auto;visibility:hidden}
.die span.on{visibility:visible}
.die.roll{animation:roll .12s linear infinite}
@keyframes roll{50%{transform:rotate(12deg) scale(.95)}}
.lines{display:flex;align-items:flex-end;justify-content:space-around;background:#fff;border-radius:10px;padding:14px 10px 6px;border:1.5px solid var(--line);height:150px}
.lines div{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-family:'Space Grotesk','Noto Sans TC';font-size:15px}
.lines i{display:block;width:6px;background:var(--navy);border-radius:3px}
.lines .ref i{background:var(--teal)}
.jurors{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.jurors .v{font-size:13px}
.road{position:relative;height:120px;background:#5C6575;border-radius:10px;overflow:hidden}
.road::after{content:"";position:absolute;left:0;right:0;top:57px;height:4px;background:repeating-linear-gradient(90deg,#F4F6F5 0 22px,transparent 22px 40px)}
.car{position:absolute;width:64px;height:30px;border-radius:9px 12px 8px 8px;top:18px}
.car::before{content:"";position:absolute;left:14px;top:5px;width:30px;height:12px;background:rgba(255,255,255,.65);border-radius:4px}
.car.a{background:#E8B04A;left:-70px}.car.b{background:#5FD3C4;top:70px;right:-70px}
.road.go .car.a{animation:ca 2.2s ease-in forwards}.road.go .car.b{animation:cb 2.2s ease-in forwards}
@keyframes ca{to{left:calc(50% - 40px);top:42px}}
@keyframes cb{to{right:calc(50% - 40px);top:50px}}
.prof{display:grid;grid-template-columns:auto 1fr auto;gap:7px 10px;align-items:center;font-size:13.5px;color:var(--sub)}
.prof .bar{height:9px;border-radius:5px;background:var(--alt);overflow:hidden}.prof .bar i{display:block;height:100%;background:var(--teal)}
.prof .bar i.hi{background:var(--amber)}
.ref{font-size:12.5px;color:var(--sub);line-height:1.55;padding-left:1.2em;text-indent:-1.2em}
.cases{display:flex;flex-direction:column;gap:8px}
.case{font:inherit;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;color:var(--ink);line-height:1.45;display:flex;flex-direction:column;gap:3px}
.case.rec{border-color:var(--amber);box-shadow:0 0 0 2px #F6DFAE}
.case h4{font-size:16.5px;display:flex;justify-content:space-between;gap:8px}
.case h4 em{font-style:normal;font-size:12px;font-weight:700;color:var(--navy);background:var(--amber);border-radius:999px;padding:1px 8px;white-space:nowrap;align-self:center}
.case .tags{display:flex;gap:5px;flex-wrap:wrap}
.case .tags span{font-size:12px;border-radius:4px;background:var(--alt);padding:1px 7px;color:var(--sub)}
.case .done{color:var(--teal);font-size:12.5px;font-weight:700}
.chart{background:#fff;border-radius:10px;border:1.5px solid var(--line);padding:6px}
.chart svg{width:100%;height:auto;display:block}
.score{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.score div{background:#fff;border-radius:8px;border:1.5px solid var(--line);padding:8px 10px;font-size:13px;color:var(--sub)}
.score b{display:block;font-family:'Space Grotesk','Noto Sans TC';font-size:22px;color:var(--teal)}
.warnbox{background:#FFF6E2;border:1px solid var(--amber);border-radius:10px;padding:10px 12px;font-size:14.5px;line-height:1.6;color:#5A4210}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

.ctx{background:#fff;border:1.5px solid var(--line);border-radius:10px;font-size:14px;flex-shrink:0}
.ctx summary{cursor:pointer;padding:8px 12px;font-weight:700;color:var(--navy);font-size:13.5px;display:flex;justify-content:space-between;gap:8px}
.ctx summary span{font-weight:500;color:var(--mute);font-size:12.5px;white-space:nowrap}
.ctxb{max-height:200px;overflow-y:auto;padding:8px 12px 10px;display:flex;flex-direction:column;gap:6px;line-height:1.55;border-top:1px solid var(--alt)}
.ctxb p{margin:0}.ctxb p b{color:#2F5D8F}.ctxb p.me b{color:var(--teal)}
.ctxb .ce{background:#F4F6F5;border-left:4px solid var(--teal);padding:6px 8px;border-radius:4px;font-size:13.5px}
.ctxb .note{font-size:13.5px}
.tline{font-size:14px;line-height:1.6;margin:2px 0}.tline b{color:#2F5D8F}

.evimg{margin:6px 0 8px;border-radius:8px;overflow:hidden;border:1px solid var(--line);max-width:420px}
.evimg svg{width:100%;height:auto;display:block}
.evimg.sm{max-width:240px}
.ce .evimg.sm{max-width:180px;margin:2px 0 6px}
.screen.img{padding:0;background:#0B1530;overflow:hidden}
.screen.img svg{width:100%;height:100%;display:block}

</style>
</head>
<body>
<div id="phone">
  <div id="top"><span id="day">國民法官</span><span id="stage">庭審日誌</span><button id="snd" aria-label="聲音設定">♪</button><button id="locker" aria-label="筆記本與證據櫃">筆</button><button id="help" aria-label="法律小幫手">？</button></div>
  <div id="issue"><span id="issueText"></span><span class="tally" id="tally"></span></div>
  <div id="scene"></div>
  <div id="progress"><div></div></div>
  <div id="dialog" style="display:none"><span id="who"></span><div id="text"></div><span id="next">▼ 點一下繼續</span></div>
  <div id="actions"></div>
  <div id="toast"></div>
  <div id="modal"><div id="sheet"></div></div>

const hz=m=>440*Math.pow(2,(m-69)/12);
function tone(f,t0,dur,{type='sine',vol=.3,att=.01,rel=.2,dest,detune=0,filt}={}){
  const c=AU.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;o.detune.value=detune;
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+att);g.gain.setValueAtTime(vol,t0+Math.max(att,dur-rel));g.gain.linearRampToValueAtTime(0,t0+dur);
  let n=o;if(filt){const f2=c.createBiquadFilter();f2.type='lowpass';f2.frequency.value=filt;o.connect(f2);n=f2;}
  n.connect(g);g.connect(dest||AU.sfxG);o.start(t0);o.stop(t0+dur+.05);return o;
}
function noise(t0,dur,{vol=.2,freq=1200,q=.8,type='bandpass',dest}={}){
  const c=AU.ctx,len=Math.ceil(c.sampleRate*dur),b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;
  const g=c.createGain();g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.001,t0+dur);
  s.connect(f);f.connect(g);g.connect(dest||AU.sfxG);s.start(t0);
}
function bell(t0,f,vol=.25,dur=3.2){ /* inharmonic partials = 鐘聲 */
  [[1,1],[2.01,.5],[2.76,.32],[5.4,.16],[8.9,.07]].forEach(([r,a])=>tone(f*r,t0,dur/(1+r*.25),{vol:vol*a,att:.004,rel:dur/(1+r*.25)-.01}));
}
function sfx(name){
  if(!AU.ctx||!AU.set.sfx)return;const t=AU.ctx.currentTime+.01;
  switch(name){
    case 'tap':tone(1800,t,.05,{type:'triangle',vol:.08,att:.002,rel:.04});break;
    case 'pop':tone(660,t,.09,{vol:.18,att:.004,rel:.08});tone(990,t+.05,.1,{vol:.12,att:.004,rel:.09});break;
    case 'next':tone(1200,t,.04,{type:'triangle',vol:.05,att:.002,rel:.03});break;
    case 'evidence':noise(t,.25,{vol:.18,freq:3000,q:.6});tone(hz(76),t+.08,.25,{vol:.16});tone(hz(83),t+.2,.45,{vol:.16});break;
    case 'oath':[72,76,79,84].forEach((m,i)=>tone(hz(m),t+i*.09,1.2-i*.1,{type:'triangle',vol:.12,att:.01,rel:.8}));break;
    case 'bell':bell(t,hz(57),.3,3.5);break;
    case 'rise':noise(t,.9,{vol:.22,freq:500,q:.4,type:'lowpass'});noise(t+.25,.7,{vol:.16,freq:900,q:.5});break;
    case 'gong':bell(t,hz(45),.42,5);tone(hz(33),t,2.5,{vol:.25,att:.01,rel:2.2});break;
    case 'deny':tone(hz(55),t,.16,{type:'square',vol:.07,filt:900});tone(hz(50),t+.17,.26,{type:'square',vol:.07,filt:900});break;
    case 'drum':for(let i=0;i<14;i++)noise(t+i*.06,.08,{vol:.05+i*.012,freq:180,q:.7,type:'lowpass'});
      tone(hz(36),t+.9,.9,{vol:.35,att:.004,rel:.8});noise(t+.9,.5,{vol:.25,freq:2500,q:.3});break;
    case 'sparkle':[79,83,86,91,95].forEach((m,i)=>tone(hz(m),t+i*.07,.5,{type:'triangle',vol:.08,att:.005,rel:.4}));break;
    case 'warn':tone(hz(81),t,.12,{vol:.12});tone(hz(81),t+.2,.12,{vol:.12});break;
    case 'lock':tone(hz(69),t,.08,{type:'triangle',vol:.14});tone(hz(64),t+.08,.18,{type:'triangle',vol:.14});break;
  }
}

const MOODS={
  calm:{bpm:52,prog:[[50,57,60,65],[46,53,57,62],[53,60,64,69],[48,55,58,64]],pulse:false,type:'triangle',filt:1400},
  trial:{bpm:66,prog:[[38,50,57,62],[34,46,53,62],[31,43,50,58],[33,45,52,61]],pulse:true,type:'sawtooth',filt:700},
  delib:{bpm:56,prog:[[41,53,57,64],[38,50,57,60],[34,46,53,57],[36,48,55,64]],pulse:false,type:'triangle',filt:1100},
  verdict:{bpm:44,prog:[[26,38,45,50],[26,38,45,53]],pulse:false,type:'sawtooth',filt:500},

function bgm(mood){
  if(!AU.ctx||AU.mood===mood)return;AU.mood=mood;clearInterval(AU.loop);
  const M=MOODS[mood];if(!M)return;
  const bar=60/M.bpm*4;let i=0,next=AU.ctx.currentTime+.1;
  const sched=()=>{
    while(next<AU.ctx.currentTime+bar*1.5){
      const ch=M.prog[i%M.prog.length];
      ch.forEach((m,k)=>{tone(hz(m),next,bar*1.15,{type:M.type,vol:k?.22:.3,att:bar*.35,rel:bar*.45,dest:AU.bgmG,filt:M.filt,detune:k%2?4:-4});});
      if(M.pulse)for(let b=0;b<4;b++)tone(hz(ch[0]-12+12),next+b*bar/4,.25,{vol:b===0?.45:.25,att:.005,rel:.2,dest:AU.bgmG,filt:300});
      next+=bar;i++;
    }
  };
  sched();AU.loop=setInterval(sched,400);
}

function applyAudioSettings(){
  if(!AU.ctx)return;const t=AU.ctx.currentTime;
  AU.bgmG.gain.setTargetAtTime(AU.set.bgm?.055:0,t,.2);AU.sfxG.gain.setTargetAtTime(AU.set.sfx?.5:0,t,.05);
  if(AU.set.voice==='off')voiceStop();
}

/* ================= voices by role ================= */
function castOf(name){if(!S||!S.C)return null;for(const k in S.C.cast){if(S.C.cast[k].n===name)return S.C.cast[k];}return null;}
function castName(short){if(!S.C||!short)return null;for(const k in S.C.cast){const n=S.C.cast[k].n;if(n.endsWith(short)||n.includes(' '+short))return n;}return null;}
function voiceFor(who){
  if(who==='審判長')return {p:.72,r:.86,cv:'rounded',cr:.85,m:true};
  if(who==='陪席法官')return {p:.86,r:.92,cv:'rounded',cr:.92,m:false};
  if(who==='受命法官')return {p:.84,r:.95,cv:'rounded',cr:.95,m:true};
  if(who==='檢察官')return {p:1.0,r:1.1,cv:'glassy',cr:1.08,m:false};
  if(who==='辯護人')return {p:.92,r:.95,cv:'buttery',cr:.95,m:true};
  if(who==='法警')return {p:.85,r:1.0,cv:'glassy',cr:1.0,m:true};
  const c=castOf(who);
  if(c){const f=c.g==='f';return {p:c.p||(f?1.15:.84),r:c.rt||.96,cv:f?'airy':'rounded',cr:c.rt||.96,m:!f};}
  const n=(who.match(/(\d)\s*號/)||[])[1];
  if(n){const k=+n;return {p:[1.15,.92,1.05,.98,1.2][(k-1)%5],r:1.0,cv:['airy','buttery','rounded','glassy','airy'][(k-1)%5],cr:1.0,m:k===2||k===4};}
  return null;
}

function roleClass(who){

}

/* ================= context recall: show what a question refers to ================= */
function markSeg(){S.mark=S.log.length;S.evMark=S.unlocked.length;}
function ctxHtml(o={}){
  if(!S||!S.C)return '';
  let lines=o.who?S.log.filter(l=>l.who===o.who):o.filter?S.log.filter(o.filter):S.log.slice(S.mark);
  if(o.last)lines=lines.slice(-o.last);
  const ids=new Set(o.who||o.filter||o.last?[]:S.unlocked.slice(S.evMark).map(e=>e.id));
  String(o.text||'').replace(/[A-Z]\d/g,m=>{ids.add(m);return m;});
  (o.ref||[]).forEach(i=>ids.add(i));
  let evs=S.unlocked.filter(e=>ids.has(e.id));
  if(o.who){const nm=o.who.split(' ').pop();evs=evs.concat(S.unlocked.filter(e=>e.kind==='test'&&e.title.includes(nm)&&!ids.has(e.id)));}
  if(o.allEv)evs=S.unlocked.slice();
  if(!lines.length&&!evs.length)return '';
  const cnt=[lines.length?lines.length+' 句發言':'',evs.length?evs.length+' 項證據':''].filter(Boolean).join('、');
  return `<details class="ctx" ${o.closed?'':'open'}><summary>${o.title||'回顧：這題相關的法庭內容'}<span>${cnt}</span></summary><div class="ctxb">${evs.map(e=>`<div class="ce">${e.kind!=='test'&&EVIMG[e.id]&&!(P&&P.gentle&&EV_SENSITIVE.includes(e.id))?evImg(e.id,true):''}<b>${esc(e.title)}</b>｜${esc(e.desc)}</div>`).join('')}${lines.map(l=>`<p class="${l.who==='你（6 號）'?'me':''}"><b>${esc(l.who)}</b>：${esc(l.text)}</p>`).join('')}</div></details>`;
}

function transcriptHtml(){

  return out;
}

/* ================= glossary ================= */
const GLOSS_COMMON=[
  ['開審陳述','開庭一開始，檢察官和辯護人各自說明「要證明什麼、用哪些證據」。像預告片，本身不是證據。'],
  ['交互詰問','傳喚證人的一方先「主詰問」，對方再「反詰問」，之後可「覆主詰問」「覆反詰問」。主詰問原則上不能誘導；反詰問可以誘導，用來檢驗證詞。'],
  ['異議','認為對方的問題或程序違法時，當場向審判長聲明。常見理由：主詰問誘導、誤導、要求證人陳述個人意見或推測、與本案無關。'],
  ['國民法官補充詢問','證人、鑑定人、被告接受詰問或詢問後，國民法官經審判長同意，可以針對判斷需要的事項補充詢問。'],
  ['鑑定人','具有專業知識的人，說明醫學、筆跡、數位資料等專業問題。鑑定人只說明專業，不替你決定被告有沒有罪。'],
  ['聲請調查證據','檢辯雙方可以聲請傳喚新證人或調取資料，要說明和待證事實的關聯，由法院決定是否准許。'],
  ['卷證不併送','法官和國民法官開庭前不看檢察官的卷宗，只用法庭上調查過的證據判斷。'],
  ['無罪推定','檢察官負責舉證。證據不足以讓你確信、還有合理懷疑時，就要做有利被告的認定。'],
  ['緘默權','被告可以拒絕陳述，不能因為被告保持沉默就推論他有罪。'],
  ['評議怎麼表決','有罪的認定需要 9 人中 2/3 以上（至少 6 票），且同時包含法官與國民法官；量刑等事項採過半數，同樣須包含雙方。'],
  ['保密義務','評議的經過、各人的意見和票數都要保密。審判期間也不要接觸媒體報導、不要自己去調查。'],
];
$('#help').addEventListener('click',()=>{

  sheet(`<h3>法律小幫手（審判長白話解釋）</h3>`+list.map(g=>`<div class="card"><h4>${g[0]}</h4>${g[1]}</div>`).join(''));
});

/* ================= step interpreter ================= */
async function run(steps){for(const st of steps)await doStep(st);}
async function doStep(st){
  if(Array.isArray(st)){const [k,x,sc]=st;const c=S.C.cast[k];await say(c?c.n:k,x,sc!==undefined?sc:(c?c.sc:null));return;}
  for(const k in STEP)if(st[k]!==undefined)return STEP[k](st[k],st);
}
const STEP={
  async card(title,st){
    actions(`<div class="card ${st.navy?'navy':st.warm?'warm':''}"><h4>${title}</h4>${st.html}</div>`);await cont(st.btn||'了解');
  },
  async issue(html){setIssue(html);},
  async ev(id,st){
    const d=(P&&P.gentle&&st.gd)||st.d;
    if(st.kind==='test'){unlock(id,st.t,d,'test');toast(`證詞已放入證據櫃：${esc(st.t)}`,2400);return;}
    const by=S.C.cast[st.by||'P'];
    const hide=P&&P.gentle&&EV_SENSITIVE.includes(id),img=EVIMG[id]?EVIMG[id]():'';
    if(st.sc)scene(st.sc);else if(img&&!hide)scene('evidence',img,'img');else scene('evidence',`${esc(st.t)}<small>證據 ${id}${hide?'・照片已依溫和模式隱藏':''}</small>`);
    await show(by.n,`請看證據 ${id}：${st.t}。`);
    actions(`<div class="card"><h4>證據 ${id}｜${esc(st.t)}</h4>${img?(hide?'<button class="btn ghost" id="showimg" style="font-size:14px;padding:9px">照片可能讓人不適，點此查看</button><div id="imgbox"></div>':evImg(id)):''}${esc(d)}</div><button class="btn" data-v="1">看清楚了</button>`);
    if(hide)$('#showimg').onclick=()=>{$('#imgbox').innerHTML=evImg(id);$('#showimg').remove();};
    await waitClick('#actions .btn[data-v]');actions('');unlock(id,`${id}｜${st.t}`,d);
    if(st.hint)await say('審判長',st.hint);
  },
  async obj(o){
    const c=S.C.cast[o.by];sfx('warn');
    await show(c.n,o.said,c.sc);
    actions(ctxHtml({last:3,title:'回顧：被異議的那段問答'})+`<div class="lesson"><p class="label">異議！換你猜</p><h4>審判長會怎麼裁定？</h4></div><div class="chips"><button class="chip s" data-v="s">異議成立</button><button class="chip k" data-v="o">異議駁回</button></div>`);
    const v=await waitClick('.chip');const ok=v===o.rule;S.sc.obj[1]++;if(ok)S.sc.obj[0]++;actions('');
    await say('審判長',o.why);
    actions(`<div class="fb ${ok?'ok':'no'}"><b>${ok?'猜對了。':'這次猜錯了。'}</b>${o.teach}</div>`);await cont();
  },
  async note(n){return NOTE[n.kind](n);},
  async ask(a){
    await show('審判長',a.intro,'ask');
    let left=a.n;const used=new Set();
    while(left>0){
      const av=a.opts.map((o,i)=>[o,i]).filter(x=>!used.has(x[1]));if(!av.length)break;
      actions(ctxHtml({title:'回顧：剛才的詰問與證詞'})+`<p class="label">國民法官補充詢問・剩 ${left} 題</p>`+av.map(([o,i],j)=>`<button class="opt" data-v="${i}"><b>${'ABCDE'[j]}</b>${esc(o.q)}</button>`).join('')+`<button class="btn ghost" data-v="x" style="font-size:14px;padding:9px">我沒有問題了</button>`);
      const v=await waitClick('#actions button');actions('');if(v==='x')break;
      const o=a.opts[+v];used.add(+v);
      await say('你（6 號）',o.q,'answer');
      if(o.bad){S.improper++;sfx('deny');await say('審判長',o.bad+'這題不列入，也不扣次數。','off');continue;}
      left--;S.asked++;const c=S.C.cast[o.to||a.to];await say(c.n,o.a,c.sc);
      if(o.note)await say('審判長',o.note);
    }
  },
  async recess(r){
    hideDialog();scene('delib');bgm('delib');stage(r.title);
    actions(`<div class="recess"><p class="label">休庭・人性觀察</p><h4>${r.title}</h4>${r.intro||'法庭休息時，回想剛才雙方的互動：誰在問、為什麼這樣問、想讓你相信什麼。'}</div>`);await cont('開始觀察','btn amber');
    for(const q of r.qs){
      actions(ctxHtml({text:q.q+q.opts.map(o=>o[0]).join(''),ref:q.ref,title:'回顧：這段休庭前的法庭內容'})+`<div class="recess"><p class="label">觀察題</p><h4>${q.q}</h4></div>`+q.opts.map((o,i)=>`<button class="opt" data-v="${i}"><b>${'ABCD'[i]}</b>${esc(o[0])}</button>`).join(''));
      const i=+(await waitClick('.opt'));const o=q.opts[i];S.sc.read[1]++;if(o[1])S.sc.read[0]++;
      $$('#actions .opt').forEach((b,j)=>{b.disabled=true;if(q.opts[j][1])b.classList.add('right');else if(j===i)b.classList.add('wrong');});
      $('#actions').insertAdjacentHTML('beforeend',`<div class="fb ${o[1]?'ok':'no'}">${o[2]}${!o[1]?'<br><b>參考：</b>'+q.opts.find(x=>x[1])[2]:''}</div>`);
      await cont();
    }
    markSeg();bgm('trial');
  },
  async interest(t){
    hideDialog();scene(t.sc||'delib');

const NOTE={
  async pick(n){
    actions(ctxHtml({text:n.q+n.opts.map(o=>o[0]).join(''),ref:n.ref})+`<div class="lesson"><p class="label">${n.title}</p><h4>${n.q}</h4>${n.intro||''}</div>`+n.opts.map((o,i)=>`<button class="opt" data-v="${i}"><b>${'ABCD'[i]}</b>${esc(o[0])}</button>`).join(''));
    const i=+(await waitClick('#actions .opt'));const o=n.opts[i];const top=Math.max(...n.opts.map(x=>x[1]));const best=n.opts.findIndex(x=>x[1]===top);
    S.sc.note[1]++;if(o[1]===top)S.sc.note[0]++;
    $$('#actions .opt').forEach((b,j)=>{b.disabled=true;if(j===best)b.classList.add('right');else if(j===i)b.classList.add('wrong');});
    $('#actions').insertAdjacentHTML('beforeend',`<div class="fb ${o[1]===top?'ok':o[1]?'mid':'no'}">${o[2]}</div>`);
    await cont(n.save?'存進筆記本':'繼續');
    if(n.save)addNote({who:n.save.who,side:n.save.side||'n',issue:n.save.issue,text:n.save.text||n.opts[best][0]});
  },
  async classify(n){
    const cats=['事實','推論','意見'];
    actions(ctxHtml({ref:n.ref})+`<div class="lesson"><p class="label">${n.title}</p>${n.intro}</div>`+n.items.map((it,i)=>`<div class="cls" data-i="${i}"><span>${esc(it[0])}</span><div class="chips">${cats.map((c,j)=>`<button class="chip ${['s','k','u'][j]}" data-c="${c}">${c}</button>`).join('')}</div><div class="fbx"></div></div>`).join(''));
    let done=0;
    await new Promise(r=>$$('.cls').forEach(box=>{const it=n.items[+box.dataset.i];
      box.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
        const ok=b.dataset.c===it[1];S.sc.note[1]++;if(ok)S.sc.note[0]++;
        box.querySelectorAll('.chip').forEach(x=>{x.disabled=true;if(x.dataset.c===it[1])x.classList.add('sel');});
        box.querySelector('.fbx').innerHTML=`<div class="fb ${ok?'ok':'no'}">${ok?'✓ ':'✗ 是「'+it[1]+'」。'}${it[2]}</div>`;
        if(++done===n.items.length)r();
      });}));
    await cont();
  },
  async write(n){
    const sd=S.C.sides;
    actions(ctxHtml(castName(n.who)?{who:castName(n.who),title:`回顧：${n.who}的證詞`}:{})+`<div class="lesson"><p class="label">${n.title}</p><h4>${n.q||'換你自己寫一則筆記'}</h4>${n.intro||'格式：<b>誰｜說了什麼｜限制或疑點</b>。短一點沒關係，只寫法庭上出現的內容。'}</div>
      <textarea id="nt" maxlength="90" placeholder="${esc(n.hint)}"></textarea>
      <p class="label">這則筆記，在法庭上會被誰拿來用？</p>
      <div class="tl">${Object.entries(USE).map(([k,u])=>`<button class="chip ${k==='P'?'k':k==='D'?'h':'u'}" style="flex:0 0 auto;padding:8px 12px" data-v="${k}">${u[0]}</button>`).join('')}</div>
      <p class="small">不用決定它「偏向哪個結論」。先想雙方各會怎麼用它，評議時再綜合判斷。</p>`);
    const side=await waitClick('#actions .chip');
    const txt=($('#nt').value||'').trim();
    const issues=[];
    if(!txt)issues.push('你沒有寫內容，先用參考寫法存起來。下次試試自己寫，寫的過程就是在整理思考。');
    else{
      if(/可憐|可怕|一定|絕對|明顯|壞人|騙子|活該|噁心|冷血|心虛|爛/.test(txt))issues.push('裡面有評價或情緒字眼。感受可以有，但筆記的主體要是「他說了什麼」。');
      if(n.who&&!txt.includes(n.who.slice(0,1))&&!txt.includes('｜'))issues.push(`記得寫是誰說的（${n.who}），評議時才知道來源。`);
      if(txt.length>70)issues.push('有點長。試著只留關鍵字和數字。');
    }
    const ok=txt&&!issues.length;S.sc.note[1]++;if(ok)S.sc.note[0]++;
    actions(`<div class="fb ${ok?'ok':'mid'}">${ok?'<b>寫得好。</b>來源、內容都清楚。':issues.join('<br>')}<br><b>參考寫法：</b>${esc(n.suggest)}</div>`);
    await cont('存進筆記本');
    addNote({who:n.who,side,issue:n.issue,text:txt||n.suggest});
  },
  async order(n){
    const items=shuffle(n.items.map((t,i)=>({t,i})));let seq=[];
    const draw=()=>{actions(ctxHtml({allEv:true,filter:()=>false,closed:true,title:'回顧：證據櫃'})+`<div class="lesson"><p class="label">${n.title}</p><h4>${n.q}</h4>依時間先後，一個一個點。</div><div class="seq">${items.map(x=>{const k=seq.indexOf(x.i);return `<button class="${k>=0?'on':''}" data-i="${x.i}"><i>${k>=0?k+1:''}</i><span>${esc(x.t)}</span></button>`;}).join('')}</div><button class="btn ghost" id="sr" style="font-size:14px;padding:9px">重排</button>`);
      $('#sr').onclick=()=>{seq=[];draw();};
      $$('.seq button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(seq.includes(i))return;seq.push(i);if(seq.length===items.length)finish();else draw();});};
    let done;const p=new Promise(r=>done=r);
    const finish=()=>{const right=seq.filter((v,k)=>v===k).length;S.sc.note[1]++;if(right>=n.items.length-1)S.sc.note[0]++;
      actions(`<div class="fb ${right===n.items.length?'ok':'mid'}"><b>排對 ${right}／${n.items.length} 個位置。</b>正確順序：<br>${n.items.map((t,k)=>(k+1)+'. '+esc(t)).join('<br>')}<br><br>${n.fb||'時間線能幫你發現「中間空掉的那幾分鐘」，那常常就是爭點所在。'}</div>`);
      cont('存進筆記本').then(()=>{addNote({who:'時間線',side:'n',issue:n.issue,text:n.items.join(' → ')});done();});};
    draw();await p;
  },
};

  for(let i=0;i<cards.length;i++){actions(`<div class="card">${cards[i]}</div><button class="btn" data-v="1">${i<cards.length-1?'下一張（'+(i+1)+'／'+cards.length+'）':'我了解了'}</button>`);await waitClick('#actions .btn');}
  if(P){actions(`<div class="card warm"><h4>檢辯雙方看你的問卷</h4>${voirDire(P)}</div>`);await cont('結果：我被選任了');}
  await show('審判長','請起立宣誓：「依法公平誠懇執行職務」。');
  actions(`<button class="btn hold" id="hold"><span class="fill" id="hf"></span>長按 2 秒・完成宣誓</button><p class="small" style="text-align:center">按住不放，直到進度條填滿</p>`);
  await new Promise(r=>{
    const b=$('#hold'),f=$('#hf');let t=null,st=0;
    const down=e=>{e.preventDefault();st=Date.now();clearInterval(t);t=setInterval(()=>{const p=Math.min(1,(Date.now()-st)/2000);f.style.width=p*100+'%';if(p>=1){clearInterval(t);r();}},30);};
    const up=()=>{clearInterval(t);f.style.width='0';};
    b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointerleave',up);
    b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')r();});
  });
  actions('');sfx('oath');await sleep(500);sfx('bell');
}

function voteWord(iss,v){return v==='y'?iss.ys:iss.ns;}
async function issueVote(iss){
  scene('delib');
  await show('審判長',iss.q);
  actions(`<div class="lesson"><p class="label">先寫再聽 ①</p><h4>${iss.q}</h4>在聽任何人發言之前，先寫下你自己的判斷。</div>
    ${ctxHtml({allEv:true,filter:()=>false,closed:true,title:'回顧：所有調查過的證據'})}
    ${S.notes.length?`<details class="ctx"><summary>回顧：我的筆記<span>${S.notes.length} 則</span></summary><div class="ctxb">${S.notes.map((n,i)=>noteHtml(n,i)).join('')}</div></details>`:''}
    <button class="opt" data-v="y"><b>A</b>${iss.yes}</button><button class="opt" data-v="n"><b>B</b>${iss.no}</button>
    <button class="btn ghost" id="gl" style="font-size:14px;padding:9px">？ 查名詞</button>`);
  $('#gl').onclick=()=>$('#help').click();
  const v0=await waitClick('#actions .opt');S.firstVote[iss.id]=v0;
  const pool=S.notes.map((n,i)=>[n,i]);
  actions(`<p class="label">先寫再聽 ②｜從筆記挑出最多 2 則理由</p>`+(pool.length?pool.map(([n,i])=>noteHtml(n,i,true)).join(''):'<div class="lockedmsg">你的筆記本是空的。沒關係，下次試著多記幾則。</div>'));
  const picks=new Set();
  $$('.note.pick').forEach(el=>el.onclick=()=>{const i=+el.dataset.i;if(picks.has(i)){picks.delete(i);el.classList.remove('on');}else if(picks.size<2){picks.add(i);el.classList.add('on');}});
  await cont('發言');
  const why=[...picks].map(i=>'「'+S.notes[i].text.slice(0,36)+(S.notes[i].text.length>36?'…':'')+'」').join('、');
  S.reasons=(S.reasons||0)+picks.size;
  await say('你（6 號）',`我認為${voteWord(iss,v0)}。`+(why?`我的依據是筆記裡的${why}。`:'我還說不太出具體的證據。'));
  for(const p of iss.npc.filter(x=>!x[1]))await say(p[0]+'國民法官',`我傾向「${voteWord(iss,p[2]?'y':'n')}」。${p[3]}`);
  for(const p of iss.npc.filter(x=>x[1]))await say(p[0],`我傾向「${voteWord(iss,p[2]?'y':'n')}」。${p[3]}`);
  await show('審判長','每個人都說完了。現在正式投票，你可以維持，也可以改變。');
  const other=v0==='y'?'n':'y';
  actions(`<p class="label">先寫再聽 ③｜最終投票</p>
    <button class="opt" data-v="keep"><b>A</b>維持：${voteWord(iss,v0)}</button>
    <button class="opt" data-v="reason"><b>B</b>改投「${voteWord(iss,other)}」：有人提出我漏掉的證據</button>
    <button class="opt" data-v="follow"><b>C</b>改投「${voteWord(iss,other)}」：大家好像都這樣想</button>`);
  const ch=await waitClick('#actions .opt');const v=ch==='keep'?v0:other;if(ch!=='keep')S.changed.push({id:iss.id,why:ch,q:iss.short});
  S.myVote[iss.id]=v;actions('');
  const all=iss.npc.map(p=>({n:p[0],j:!!p[1],v:p[2]?'y':'n'})).concat([{n:'你（6 號）',j:false,v,me:true}]);
  const yv=all.filter(x=>x.v==='y');const need=iss.rule==='guilt'?6:5;
  const pass=yv.length>=need&&yv.some(x=>x.j)&&yv.some(x=>!x.j);S.res[iss.id]=pass;
  scene('vote');sfx('drum');
  actions(`<p class="label">${esc(iss.short)}・表決（9 票）</p>
    <div class="votes">${all.map(x=>`<div class="v ${x.v==='y'?'k':'h'} ${x.me?'me':''}"><b>${x.n}</b>${voteWord(iss,x.v)}</div>`).join('')}</div>
    <div class="meter"><div class="a" style="width:${yv.length/9*100}%"></div><div class="b" style="flex:1"></div></div>
    <div class="row"><span>${esc(iss.ys)} ${yv.length} 票</span><span>門檻 ${need} 票${iss.rule==='guilt'?'（2/3）':'（過半）'}，且含法官與國民法官</span></div>
    <div class="card ${pass?'warm':''}">${pass?iss.passText:iss.failText}</div>`);
  const pivot=(yv.length===need&&v==='y')||(yv.length===need-1&&v==='n');
  await show('審判長',pass?'達到門檻。':'沒有達到門檻'+(iss.rule==='guilt'?'，依無罪推定，不能做不利被告的認定。':'。')+(pivot?'你的一票剛好決定了結果。':''));
  await cont('繼續');
}
async function sentencing(C){
  const out=S.out;const sn=out.sent;
  if(!sn){await say('審判長',out.noSent||'評議結果不成立犯罪，不需要討論刑度。','delib');return;}
  stage('終局評議｜科刑',94);scene('delib');
  await show('審判長',`最後一個議題：${out.label}，刑度多重？請先寫下並鎖定你的刑度，再聽其他人。法官會最後發言。`);
  if(P&&P.flags&&P.flags.includes('anchor')){actions(`<div class="warnbox"><b>你的側寫提醒</b>｜前測的骰子遊戲顯示你可能受隨機數字影響。檢察官的求刑也是一個「錨」。先回到筆記裡的量刑事由，再決定數字。</div>`);await cont('收到');}
  const def=Math.round((sn.min+sn.max)/2/6)*6;
  actions(ctxHtml({filter:l=>/求處|從輕|量刑|賠償|前案|悔|對不起|復健|提心吊膽|真相|回不來/.test(l.text),title:'回顧：科刑辯論與被害人陳述'})+(C.sentExtra?C.sentExtra(S):'')+`<div class="card"><h4>參考</h4>${sn.ref}<div class="small">刑度範圍為遊戲簡化設定，未列出無期徒刑、死刑與罰金等選項。</div></div>
    <div class="big" id="sv"></div><input type="range" id="sl" min="${sn.min}" max="${sn.max}" step="1" value="${def}">
    <div class="row"><span>${fmt(sn.min)}</span><span>${fmt(sn.max)}</span></div><button class="btn amber" data-v="1">鎖定我的刑度</button>`);
  let sl=$('#sl'),sv=$('#sv');let up=()=>sv.textContent='有期徒刑 '+fmt(+sl.value);sl.oninput=up;up();
  await waitClick('#actions .btn');S.my0=+sl.value;actions('');
  await say('你（6 號）',`我先寫下：有期徒刑 ${fmt(S.my0)}。（已鎖定）`);
  for(const p of sn.npc.filter(x=>!x[1]))await say(p[0]+'國民法官',`我會判 ${fmt(p[2])}。${p[3]}`);
  for(const p of sn.npc.filter(x=>x[1]))await say(p[0],`我會判 ${fmt(p[2])}。${p[3]}`);
  const js=sn.npc.filter(x=>x[1]);const jAvg=js.reduce((a,p)=>a+p[2],0)/js.length;
  await show('審判長','每個人都說完了。你可以修改一次刑度，也可以維持。');
  actions(`<div class="card"><h4>你鎖定的刑度：${fmt(S.my0)}</h4><span class="small">國民法官 ${sn.npc.filter(x=>!x[1]).map(p=>fmt(p[2])).join('、')}<br>法官 ${js.map(p=>fmt(p[2])).join('、')}</span></div>
    <div class="big" id="sv"></div><input type="range" id="sl" min="${sn.min}" max="${sn.max}" step="1" value="${S.my0}">
    <p class="label">如果要修改，原因是？</p>
    <button class="opt" data-v="reason"><b>A</b>有人提到我漏看的量刑事由</button>
    <button class="opt" data-v="follow"><b>B</b>我想跟大家的意見一致</button>
    <button class="opt" data-v="keep"><b>C</b>維持我原本的刑度</button>`);
  sl=$('#sl');sv=$('#sv');up=()=>sv.textContent='有期徒刑 '+fmt(+sl.value);sl.oninput=up;up();
  const why=await waitClick('#actions .opt');
  S.my1=why==='keep'?S.my0:+sl.value;S.sentWhy=why;actions('');
  S.anchor=Math.abs(jAvg-S.my0)<1?null:Math.max(0,Math.min(100,Math.round((S.my1-S.my0)/(jAvg-S.my0)*100)));
  const vals=sn.npc.map(p=>p[2]).concat([S.my1]).sort((a,b)=>a-b);S.sentence=vals[4];S.jAvg=jAvg;
  scene('vote');sfx('drum');
  await say('審判長',`各位的意見從 ${fmt(vals[0])} 到 ${fmt(vals[8])}。依過半數意見（遊戲以 9 人的中位數呈現），刑度定為 ${fmt(S.sentence)}。`);
}
async function deliberate(C){
  hideDialog();scene('delib');bgm('delib');stage('終局評議',88);setDay(C.delibDate+'｜評議');
  actions(`<div class="card navy"><h4>評議室規則</h4>① 有罪的認定：9 票中至少 6 票，且含法官與國民法官。<br>② 量刑：過半數，且含雙方。<br>③ <b style="color:#E8B04A">先寫再聽</b>：每個議題你都先寫下自己的判斷，再聽別人，法官最後說。</div>
    <div class="card"><h4>為什麼要先寫再聽？</h4>研究發現，評議開始時的多數意見，常常就決定了最後結果（Kalven & Zeisel, 1966）；在從眾實驗中，即使答案很明顯，也有不少人會跟著一致的錯誤多數走（Asch, 1956）。先寫下來，是保護你自己的判斷。</div>`);
  await cont('進入評議');
  for(const iss of C.delib){if(iss.when&&!iss.when(S))continue;await issueVote(iss);}
  S.out=C.outcome(S);
  await sentencing(C);
}

/* ================= verdict & review ================= */
async function verdict(C){
  stage('宣示判決',100);scene('verdict');setDay(C.verdictDate+'｜宣判');bgm('verdict');sfx('rise');
  await say('法警','全體起立。');sfx('gong');
  await say('審判長',C.verdictText(S));
  review(C);
}
function leanChart(C){
  const L=S.lean.filter(p=>p.v!=null);const skip=S.lean.length-L.length;
  if(!L.length)return '<div class="lockedmsg">你每個庭期都選擇先不表態，一直等到評議才形成判斷。這正是國民法官被期待的做法。</div>';
  const note=skip?`<p class="small">有 ${skip} 個庭期你選擇先不表態。</p>`:'';
  const W=300,H=130,pl=26,pr=26,pt=22,pb=24,n=L.length;
  const x=i=>pl+(n===1?(W-pl-pr)/2:i*(W-pl-pr)/(n-1)),y=v=>pt+v/100*(H-pt-pb);
  const pts=L.map((p,i)=>`${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="心證軌跡">
    <rect x="${pl}" y="${pt}" width="${W-pl-pr}" height="${H-pt-pb}" fill="#F4F6F5"/>
    <line x1="${pl}" x2="${W-pr}" y1="${y(50)}" y2="${y(50)}" stroke="#C5D1CE" stroke-dasharray="4 4"/>
    <text x="4" y="13" font-size="11" fill="#9A3328" font-weight="700">${esc(C.lean.a)}</text>
    <text x="${W-4}" y="${H-6}" font-size="11" fill="#22578C" font-weight="700" text-anchor="end">${esc(C.lean.b)}</text>
    <polyline points="${pts}" fill="none" stroke="#0E7C74" stroke-width="3" stroke-linejoin="round"/>
    ${L.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="5" fill="#0E7C74"/><text x="${x(i)}" y="${y(p.v)-9}" font-size="10.5" fill="#13233F" text-anchor="middle">${p.label}</text>`).join('')}
  </svg></div>`;
}
function selfCheck(){
  const out=[];if(!P)return '<p class="small">你這次沒有做心理側寫。做完側寫，這裡會比對「測驗中的你」和「評議中的你」。</p>';
  const fl=P.flags||[];
  const follow=S.changed.filter(c=>c.why==='follow').length,reason=S.changed.filter(c=>c.why==='reason').length;
  if(fl.includes('conform'))out.push(follow?'前測：從眾傾向較高｜評議：你有 '+follow+' 次因為「大家都這樣想」改票。下次先問自己：我聽到新的證據了嗎？':'前測：從眾傾向較高｜評議：你沒有因為多數而改票，守住了判斷。');
  else out.push(follow?'前測：從眾傾向不高｜評議：但你有 '+follow+' 次因為多數改票。評議室的壓力比測驗大。':(reason?'評議中你因為「新的理由」改票 '+reason+' 次，這是好的改變。':'評議中你維持了自己的判斷。'));
  if(S.anchor!=null)out.push((fl.includes('anchor')?'前測：容易受數字錨定｜':'')+`量刑：你往法官平均移動了 ${S.anchor}%。`+(S.anchor>=50&&S.sentWhy==='follow'?'而且理由是「想一致」，這正是錨定的樣子。':''));
  if(fl.includes('story'))out.push(`前測：會用故事補完空白｜本案你挑了 ${S.reasons||0} 則筆記當理由。理由越扎根在筆記，越不容易被故事帶走。`);
  if(fl.includes('credential'))out.push('前測：容易被頭銜說服｜回想一下，鑑定人說「不能判斷」的那句話，你有記進筆記嗎？');
  if(fl.includes('justworld'))out.push('前測：相信世界公平的程度較高｜這種信念有時會讓人覺得被害人「也有錯」。評議時，你有沒有因為被害人的品行而改變對事實的判斷？');
  return out.map(t=>`<p style="margin:4px 0">・${t}</p>`).join('');
}
function review(C){
  voiceStop();bgm('calm');sfx('sparkle');hideDialog();scene('court');stage('你的審判回顧',100);setDay('結案');
  DONE[S.case]=true;store('cj2-done',DONE);
  const r=(a)=>a[1]?`${a[0]}／${a[1]}`:'—';
  const iss=C.delib.filter(i=>S.myVote[i.id]);
  actions(`<div class="card navy"><h4>判決</h4>${C.verdictShort(S)}</div>
   <div class="card"><h4>你的評議</h4>${iss.map(i=>`<b>${esc(i.short)}</b>：先寫「${voteWord(i,S.firstVote[i.id])}」→ 最終「${voteWord(i,S.myVote[i.id])}」`).join('<br>')}${S.my0!=null?`<br><b>刑度</b>：先寫 ${fmt(S.my0)} → 最終 ${fmt(S.my1)}`:''}</div>
   <p class="label">心證軌跡（每個庭期結束時）</p>${leanChart(C)}
   <p class="small">信念會隨證據順序起伏，最後出現的證據常影響特別大（Hogarth & Einhorn, 1992）。看看你的線，是在哪一天轉彎的？</p>
   <div class="score"><div><b>${r(S.sc.obj)}</b>異議裁定預測</div><div><b>${r(S.sc.note)}</b>筆記練習</div><div><b>${r(S.sc.read)}</b>人性與利益觀察</div><div><b>${r(S.sc.duty)}</b>國民法官義務</div><div><b>${S.notes.length}</b>筆記則數</div><div><b>${S.asked}</b>補充詢問（不當 ${S.improper}）</div></div>
   ${S.anchor!=null?`<div class="card warm"><h4>被帶走指數（錨定）</h4><div class="anchor">${S.anchor}%</div><p>你的刑度從 ${fmt(S.my0)} 改成 ${fmt(S.my1)}，往法官平均（${fmt(S.jAvg)}）移動了 ${S.anchor}%。</p></div>`:''}
   ${C.reviewExtra?C.reviewExtra(S):''}
   <div class="card"><h4>側寫 vs. 你在評議室的表現</h4>${selfCheck()}</div>
   <div class="card"><h4>這個案子用到的心理學</h4>${C.psych.map(p=>`<p class="ref">・${p}</p>`).join('')}</div>
   <button class="btn amber" id="nextc">選下一個案件</button>
   <button class="btn ghost" id="seeP">${P?'看我的心理側寫':'做心理側寫前測'}</button>
   <p class="small">${C.credit}</p>`);
  $('#nextc').onclick=()=>pickCase();
  $('#seeP').onclick=()=>P?showProfile(true):runProfile().then(pickCase);
}

/* ================= case runner ================= */
async function playCase(key){
  reset();S.case=key;S.C=CASES[key];const C=S.C;
  S.sched=C.days.map(d=>({date:d.date,items:d.plan.map(t=>({t}))})).concat([{date:C.delibDate,items:[{t:'終局評議（不公開）'}]},{date:C.verdictDate,items:[{t:'宣示判決'}]}]);
  $('#issue').classList.remove('on');tally();hideToast();
  await caseIntro(C);
  await oath();
  for(let i=0;i<C.days.length;i++){
    const d=C.days[i];
    if(i>0)await between(C.days[i-1],d);
    S.dayIx=i;setDay(`第 ${i+1} 庭｜${d.date}`);stage(d.title,Math.round((i+1)/(C.days.length+2)*100));bgm('trial');
    if(C.issueHtml&&i>0)setIssue(C.issueHtml);
    markSeg();await run(d.steps);
    await dayEnd(C,i);
  }
  S.dayIx=C.days.length;
  await between(C.days[C.days.length-1],{date:C.delibDate,wait:'辯論終結後',title:'終局評議'});
  await deliberate(C);
  await verdict(C);
}

function buildProfile(R){
  const cl=v=>Math.max(0,Math.min(100,Math.round(v)));
  const t={
    anchor:R.anchored?75:25,
    conform:R.conform*50,
    story:Math.round(R.falseRecall/3*100),
    misinfo:cl((R.glass===0?75:R.glass===2?45:15)+(R.verb==='撞爛'&&R.speed>=3?10:0)),
    credential:R.credential?75:25,
    justworld:Math.round((R.jw1+R.jw2)/8*100),
    reflect:R.crt*50,
    convict:cl((100-R.threshold)*1.3+R.jbs1*8+(4-R.jbs2)*7+(R.blackstone<=1?14:0)+R.trust*3),
  };
  const risk=['story','conform','anchor','misinfo','credential','justworld'];
  const flags=risk.filter(k=>t[k]>=60);
  const top=risk.slice().sort((a,b)=>t[b]-t[a])[0];
  return {R,t,flags,top:t[top]>=60?top:'calm',gentle:R.gentle,at:Date.now()};
}

async function showProfile(fromReview){
  hideDialog();scene('court');setDay('我的側寫');stage('國民法官心理側寫',100);sfx('sparkle');
  const a=ARCH[P.top]||ARCH.calm;const t=P.t;
  const extra=t.reflect>=100?'＋慢想派':'';
  const bar=k=>`<span>${TRAIT_LABEL[k]}</span><span class="bar"><i class="${t[k]>=60&&k!=='reflect'?'hi':''}" style="width:${Math.max(4,t[k])}%"></i></span><span class="num">${t[k]}</span>`;
  const tips={story:'筆記裡把「推論」和「事實」分開。',conform:'評議時先寫下自己的票，再聽別人。',anchor:'量刑前先列量刑事由，再看數字。',misinfo:'注意詰問的用字，特別是誘導式問題。',credential:'記下專家「不能判斷」的部分。',justworld:'被害人的品行，不等於被告有沒有做。'};
  actions(`<div class="type"><p class="label" style="color:#5FD3C4">你的國民法官側寫</p><h3>${a[0]}${extra}</h3><p>${a[1]}</p></div>
    <div class="prof">${['anchor','conform','story','misinfo','credential','justworld','reflect','convict'].map(bar).join('')}</div>
    <p class="small">橘色代表在這個傾向上分數較高，審判中會收到對應的提醒。分數只是遊戲中的粗略指標。</p>
    ${P.flags.length?`<div class="card warm"><h4>審判中會提醒你</h4>${P.flags.map(f=>'・'+tips[f]).join('<br>')}</div>`:''}
    <div class="card"><h4>選任程序：檢辯雙方怎麼看你</h4>${voirDire(P)}</div>
    <button class="btn amber" id="pgo">${fromReview?'選下一個案件':'選擇案件（推薦：'+CASES[a[2]].short+'）'}</button>
    <button class="btn ghost" id="pref">查看參考文獻</button>
    <button class="btn ghost" id="predo">重新做前測</button>`);
  $('#pref').onclick=refsSheet;
  await new Promise(r=>{$('#pgo').onclick=r;$('#predo').onclick=async()=>{await runProfile();r('done');};}).then(v=>{if(v!=='done')return pickCase();});
}

  ['犯意聯絡','彼此對要做的事有共同的認識，不一定要明說，可以從前後情況推論。但只說「去溝通」，和說「去打他」是不同的。'],
  ['傷害致死（結果加重犯）','故意傷害人，結果造成死亡，而且行為人「能預見」可能致死（刑法第 17 條），就成立傷害致死，刑度遠重於傷害罪。'],
  ['拒絕證言','證人如果回答會讓自己受到刑事追訴，可以拒絕回答該問題（刑事訴訟法第 181 條）。'],
  ['違反自身利益的陳述','證人說出對自己或自己支持的一方不利的話，通常被認為比較可信，因為人很少無故說對自己不利的事。'],
 ],

   d:[['欠條是被害人親筆簽的，債務是真的，被告是在討自己的錢',1,'對。這是辯方的地基：真實債權存在，就可能不是「勒贖」。'],['欠條是假的，所以被告沒有錯',0,'這會傷害辯方自己。辯方需要欠條是真的。']],

  {ev:'K2',t:'通話錄音（蘇妻手機）',d:'8/10 10:05 被告：「三百萬，一毛都不能少，再加五十萬，算他讓我等這麼久。明天中午前，不然你們就見不到他了。」'},
  {ev:'K3',t:'診斷證明書',d:'腰椎第一節爆裂性骨折，雙下肢肌力明顯減弱，經手術後仍須長期復健，醫師評估難以完全恢復。',gd:'腰椎骨折，雙腿行動能力受損，需長期復健。'},

  ['D','我收回。最後一個問題：你被關的兩天裡，被告有沒有打你？'],
  ['V','沒有打我。但他綁著我、威脅我。'],
  {ev:'T1',kind:'test',t:'被害人蘇志遠的證詞',d:'稱欠條是 2024/12 被告帶人到家中逼簽，但從未報警或告訴他人；承認合夥結束時對金額有爭議（認為虧損應分擔）；倉庫中被束帶綁手、只給水和麵包；聽到「拿不到錢就讓他消失」才跳窗；被告沒有打他。'},
  {tip:'justworld',text:'你在前測中，「公正世界信念」較高。被害人欠錢不還，可能讓你覺得「他也有錯」。記得分開兩件事：債務糾紛是民事問題；被拘禁、受重傷，是本案要判斷的事實。'},

  {note:{kind:'pick',title:'筆記教室 2｜把關鍵數字記清楚',q:'哪一則筆記，最能幫你在評議時判斷「勒贖還是討債」？',opts:[

   ['欠條 300 萬（蘇稱被逼簽，未報警）｜電話要 300＋50 萬｜「不只要三百，要你知道代價」',2,'好！「欠條金額」和「實際要求金額」並排，你就能看出多出來的 50 萬，那正是爭點的核心。'],
   ['要錢＝勒贖。',0,'討債也是要錢。關鍵在於，要的是不是「自己有權利拿的錢」。']],save:{who:'金額比對',side:'n',issue:'i1'}}},
  {recess:{title:'上午休庭',qs:[

    ['一定是假的，否則他會報警',0,'被威脅的人不報警並不少見，可能害怕報復。但沒有其他證據時，這個說法也很難被證實。'],
    ['他有動機這麼說（如果欠條無效，他就不用還錢），需要其他證據支持',1,'對。注意他的利益：欠條無效，對他的民事債務有利。他可能說實話，也可能有利益。下一個庭期的筆跡鑑定與會計師，就是用來檢驗這點的。'],
    ['這不重要',0,'這攸關債務是否真實，是第一個爭點的核心。']]}]}},
  {interest:{who:'被害人 蘇志遠',sc:'victim',desc:'他受了重傷，可能終身行動不便；他同時是被告的債務人。',opts:['不用還債','民事賠償','人身安全','讓被告重判','職業責任'],ans:[0,1,2,3],push:'被威脅、被綁、怕被殺、欠條是被逼簽的。',hide:'債務的來龍去脈、自己拖延還款。',note:'被害人可以同時是真正的受害者，又有自己的利益。兩件事並不衝突。'}},

  ['P','陳先生，被告當初找你，是怎麼說的？'],

  {obj:{by:'P',said:'異議！這和本案無關。',rule:'o',why:'異議駁回。證人作證是否可能讓自己獲得有利結果，與證詞可信度直接相關，可以問。',teach:'共犯證人的「誘因」是反詰問的重點。研究發現，陪審員即使知道證人有誘因，也常常不會因此調整對證詞的評價（Neuschatz 等人，2008）。'}},
  ['K','……沒有人跟我保證什麼。但律師說，好好配合，法官會看到。'],

  {recess:{title:'午休',intro:'陳家成的證詞對雙方都有用，這很少見。',qs:[

  {interest:{who:'證人 陳家成',sc:'victim_sad',desc:'當晚一起押人的共犯，自己的案件還在審理中。',opts:['自己的刑期','和被告的交情','金錢','面子','正義感'],ans:[0,1],push:'自己只是被找去幫忙、主導的是被告。',hide:'自己動手的部分。',note:'他對雙方都說了不利的話，這反而讓他比較可信。但他有減輕自己責任的誘因，凡是「把責任推給被告」的部分，都要特別找其他證據印證。'}},

  {note:{kind:'order',title:'筆記教室 5｜排出時間線',q:'依時間先後，點出這些事件',issue:'i1',items:['2019 合夥開店，吳出資 300 萬','2024/12/20 蘇簽下 300 萬欠條','2025/6/30 欠條清償期限過了','8/9 20:00 蘇被押上廂型車','8/10 10:05 被告打電話要 300＋50 萬','8/10 晚上 蘇聽到「讓他消失」','8/10 23:30 蘇跳窗受重傷']}},

const CASE_ORDER=['murder','dui','affair','land','kidnap','bribe'];
async function pickCase(){
  reset();hideDialog();hideToast();scene('court');setDay('選擇案件');stage('國民法官：庭審日誌',0);$('#issue').classList.remove('on');tally();bgm('calm');
  const rec=P?(ARCH[P.top]||ARCH.calm)[2]:null;
  actions(`<p class="label">選擇要審理的案件</p><div class="cases">${CASE_ORDER.map(k=>{const C=CASES[k];return `<button class="case ${k===rec?'rec':''}" data-v="${k}"><h4><span>${C.title}</span>${k===rec?'<em>推薦你</em>':''}</h4><span class="small">${C.sub}</span><span class="tags">${C.tags.map(t=>`<span>${t}</span>`).join('')}<span>${C.days.length} 個庭期＋評議</span></span>${DONE[k]?'<span class="done">✓ 已審理過</span>':''}</button>`;}).join('')}</div>
    <p class="small">現實中國民法官是逐案隨機抽選，不能挑案件，也不會依個性分案。這裡只是選擇練習的案子。所有案件除《王鈞殺人未遂案》改編自司法院模擬劇本外，皆為虛構。</p>
    <button class="btn ghost" id="toP">${P?'看我的心理側寫':'先做心理側寫前測'}</button>`);
  $('#toP').onclick=()=>P?showProfile(false):runProfile();
  const k=await waitClick('.case');
  actions('');await playCase(k);
}

    <p>六個案件：殺人、酒駕致死、外遇疑雲、財團與土地、擄人勒贖、收賄。每個案子都有開審陳述、交互詰問、鑑定人、新證人，最後進評議室投票。</p>
    <p>開庭前，先玩 9 個改編自<b>法律心理學研究</b>的小關卡，看看你的判斷習慣可能怎麼影響審判。</p>
    <button class="btn amber" id="go">${P?'重新做心理側寫':'開始心理側寫（約 6 分鐘）'}</button>
    <button class="btn ghost" id="skip">${P?'用上次的側寫，直接選案':'跳過，直接選案'}</button>
    <p class="small">有背景音樂、音效與角色語音，右上角「♪」可調整。「筆」是筆記本與證據櫃，「？」可請審判長白話解釋法律名詞。</p></div>`);
  const v=await new Promise(r=>{$('#go').onclick=()=>r('p');$('#skip').onclick=()=>r('s');});
  auInit();bgm('calm');
  if(v==='p')await runProfile();else await pickCase();
}
start();

</script>
</body>
